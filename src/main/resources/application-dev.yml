spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/athletiq}
    username: ${DB_USERNAME:athletiq}
    password: ${DB_PASSWORD:athletiq}

athletiq:
  dev:
    # Mot de passe des comptes de démonstration créés par DevDataSeeder (profil dev uniquement).
    # Volontairement sans valeur par défaut : sans ATHLETIQ_DEV_DEMO_PASSWORD, aucun compte de démo n'est créé.
    demo-password: ${ATHLETIQ_DEV_DEMO_PASSWORD:}
  security:
    reset-token:
      # En dev, le jeton de réinitialisation est renvoyé dans la réponse : aucun service d'e-mail
      # n'existe encore, le parcours doit rester testable de bout en bout.
      reset-token-exposed: true
  # Clés de DÉVELOPPEMENT uniquement (publiques puisque versionnées) : ne jamais les réutiliser ailleurs.
  invitation:
    encryption-key: ${ATHLETIQ_INVITATION_ENCRYPTION_KEY:7tCpXGP7i6cYH/n4OFmw1QDwLaJzADW1l85qbmb5Ni0=}
    hmac-key: ${ATHLETIQ_INVITATION_HMAC_KEY:Cpd4K/yccKgpVHJr5aFz6gY5F4Vf9gX620yUvzsObcI=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.athletiq: DEBUG
