spring:
  application:
    name: athletiq-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Sérialise les pages au format stable { content, page: { size, number, totalElements, totalPages } }.
        serialization-mode: via-dto
  jackson:
    deserialization:
      # Refuse 8.5 là où un entier est attendu (répétitions, repos) au lieu de le tronquer en 8 : 400 MALFORMED_REQUEST.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  error:
    include-stacktrace: never

athletiq:
  security:
    jwt:
      # Clé HS256 d'au moins 32 octets (256 bits), fournie uniquement par variable d'environnement.
      secret: ${ATHLETIQ_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      issuer: athletiq-api
    reset-token:
      # Sans service d'e-mail, le jeton brut n'est renvoyé par l'API que hors production.
      # En production, il n'est jamais exposé et le parcours « mot de passe oublié » reste à brancher.
      reset-token-exposed: ${ATHLETIQ_RESET_TOKEN_EXPOSED:false}
      ttl: 1h
  # Codes d'invitation des athlètes (#3) : clés de 32 octets en base64, uniquement par variables
  # d'environnement. Sans elles, l'application refuse de démarrer (seuls dev et test ont une valeur par défaut).
  invitation:
    encryption-key: ${ATHLETIQ_INVITATION_ENCRYPTION_KEY:}
    hmac-key: ${ATHLETIQ_INVITATION_HMAC_KEY:}
    ttl: P7D
  # Premier administrateur, créé au démarrage s'il n'existe pas (laisser vide pour ne rien créer).
  admin:
    email: ${ATHLETIQ_ADMIN_EMAIL:}
    password: ${ATHLETIQ_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # Planification (#6, Q12) : « aujourd'hui » est calculé dans ce fuseau unique, identique web et mobile.
  planning:
    zone: Europe/Paris

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
